# ┌───────────────────────┐
# │ arpatek - tmux Config │
# └───────────────────────┘

# ──[ Color Support ]───────────────────────────────────────────────────────────
# Tell tmux it is running in a 256-color + truecolor terminal.
# Without Tc, programs inside tmux (nvim, etc.) fall back to 256-color mode —
# catppuccin and other 24-bit themes will look washed out or incorrect.
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# ──[ Extended Keys & Passthrough ]─────────────────────────────────────────────
# tmux swallows two things TUI apps like Claude Code depend on.
#
# Extended keys: terminals send plain Enter and Shift+Enter as the same byte
# unless CSI-u encoding is negotiated. tmux only forwards those sequences when
# it knows the outer terminal speaks them, so Shift+Enter submits instead of
# inserting a newline. Note the option is 'extended-keys' but the feature flag
# in terminal-features is 'extkeys' — using the long name there is silently
# ignored.
#
# Passthrough: lets OSC escape sequences reach the outer terminal, so desktop
# notifications and progress bars survive the trip out of the pane.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ──[ Scrollback & Focus ]──────────────────────────────────────────────────────
# Default scrollback is 2000 lines — far too low for log tailing
set -g history-limit 50000

# Propagate focus events to programs inside panes so nvim can trigger autoread
# when a file changes on disk (requires focus-events in nvim too, which is default)
set -g focus-events on

# Refresh the status bar every 5 seconds (default is 15)
set -g status-interval 5

# ──[ Prefix Key ]──────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ──[ Splitting Windows ]───────────────────────────────────────────────────────
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# ──[ Pane & Window Navigation ]────────────────────────────────────────────────
# mode-keys vi only covers copy mode, so pane movement needs its own bindings.
# -r makes them repeatable within repeat-time (500ms) — prefix once, then h h h.
# 'l' shadows the default last-window binding, moved to 'b' below.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize with capitals. 'L' shadows switch-client -l, unused single-session.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle between the current and previous window. Not repeatable on purpose —
# repeat-time would swallow a fast double-tap as one press.
bind b last-window

# ──[ Basic Usability ]─────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ──[ Reload Config ]───────────────────────────────────────────────────────────
bind r source-file "~/.config/tmux/tmux.conf" \; display-message "tmux.conf reloaded"

# ──[ Copy Mode ]───────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
# Yank to the system clipboard — pbcopy (macOS), then xclip/xsel (Linux/X11)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy 2>/dev/null || xclip -selection clipboard -in 2>/dev/null || xsel --clipboard --input 2>/dev/null || true"

# ──[ Visual / Behavior Tweaks ]────────────────────────────────────────────────
# Faster escape time (better for vim / shells)
set -sg escape-time 10

# Don't delay after exiting a pane
set -g detach-on-destroy off

# ──[ Status Bar ]──────────────────────────────────────────────────────────────
set -g @tokyo-night-tmux_transparent 1
set -g @tokyo-night-tmux_show_git 1
set -g @tokyo-night-tmux_show_netspeed 1
set -g @tokyo-night-tmux_show_battery_widget 1
set -g @tokyo-night-tmux_show_music 1
set -g @tokyo-night-tmux_show_hostname 1
set -g @tokyo-night-tmux_window_id_style super
set -g @tokyo-night-tmux_pane_id_style sub
set -g @tokyo-night-tmux_zoom_id_style icon

# ──[ Location Widget ]─────────────────────────────────────────────────────────
# Replaces the plugin's path widget, which shows the local cwd and then freezes
# at whatever it was when the pane opened an ssh session. location-widget.sh
# shows the ssh target while the pane is remote, and the remote cwd alongside it
# when the far-side shell emits OSC 7.
#
# The leading and trailing '_' entries are load-bearing. tmux quotes any option
# value containing spaces and the plugin's list parser doesn't strip the quotes,
# so the first and last entries get eaten by them. The sentinels take that hit
# instead of battery and datetime.
set -g @tokyo-night-tmux_show_right_widgets "_, battery, #(~/.config/tmux/scripts/location-widget.sh #{q:pane_tty} #{q:pane_current_command} #{q:pane_current_path} #{q:pane_path}), music, netspeed, git, wbg, datetime, _"

run ~/.config/tmux/plugins/tokyo-night-tmux/tokyo-night.tmux

# ──[ Pane Count ]──────────────────────────────────────────────────────────────
# The plugin labels each window with #P, the focused pane index. This rewrites
# both window status formats to #{window_panes} so the label is a count instead.
# Must run after the plugin, which sets those formats.
run ~/.config/tmux/scripts/window-pane-count.sh
